services:
  # ----------------------------
  # MariaDB (shared database)
  # ----------------------------
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD}"
    volumes:
      - shared_mariadb_data:/var/lib/mysql
    networks:
      - shared_db_net

  # ----------------------------
  # phpMyAdmin (Apache)
  # ----------------------------
  phpmyadmin:
    build:
      context: ./phpmyadmin-dockerfile
    restart: unless-stopped
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
    expose:
      - "80"   # Dokploy / reverse proxy only
    networks:
      - shared_db_net

# ----------------------------
# Persistent Volumes
# ----------------------------
volumes:
  shared_mariadb_data:

# ----------------------------
# External Shared Network
# ----------------------------
networks:
  shared_db_net:
    external: true